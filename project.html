<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details — Yasmin</title>
    <meta name="description" content="View graphic design project details, visual identity, case study and gallery by Yasmin.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Main website style -->
    <link rel="stylesheet" href="styles.css">

    <!-- Project details style -->
    <link rel="stylesheet" href="project.css">
</head>

<body class="project-page">

    <div class="progress"></div>

    <!-- =========================
         NAVBAR
    ========================== -->
    <header class="nav-wrap">
        <nav class="nav glass">
            <a class="brand" href="index.html" aria-label="Yasmin — Home">
                <img src="assets/logo.jpg" alt="Yasmin Logo">
                <span class="brand-initials">YS</span>
            </a>

            <div class="nav-links">
                <a href="index.html#home">Home</a>
                <a href="index.html#about">About</a>
                <a class="active" href="projects.html">Projects</a>
                <a href="index.html#skills">Skills</a>
                <a href="index.html#contact">Contact</a>
            </div>

            <a class="pill-btn" href="index.html#contact">
                Let's Talk
                <span>→</span>
            </a>

            <button class="menu-btn" aria-label="Toggle navigation">☰</button>
        </nav>
    </header>

    <!-- =========================
         PROJECT DETAIL CONTAINER
    ========================== -->
    <main class="project-detail">
        <!-- Floating decorative clouds -->
        <div class="cloud projects-cloud projects-cloud-a" style="opacity: 0.85; top: 12%;"></div>
        <div class="cloud projects-cloud projects-cloud-b" style="opacity: 0.85; top: 45%;"></div>
        <div class="cloud projects-cloud cloud-d" style="opacity: 0.85; bottom: 20%;"></div>

        <div class="inner">
            <!-- Navigation back -->
            <div class="project-top-bar">
                <a class="back" href="projects.html">
                    ← Back to All Projects
                </a>
            </div>

            <!-- Dynamic Project Content injected by project.js -->
            <div id="project">
                <div class="project-loading">
                    <div class="loader-mascot">✦</div>
                    <p>LOADING PROJECT DETAILS...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- =========================
         IMAGE LIGHTBOX MODAL
    ========================== -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
        <div class="lightbox-backdrop"></div>
        <div class="lightbox-dialog">
            <button class="lightbox-close" aria-label="Close image viewer">×</button>
            <button class="lightbox-prev" aria-label="Previous image">‹</button>
            <div class="lightbox-img-wrap">
                <img id="lightboxImg" src="" alt="Project zoomed preview">
                <div id="lightboxCaption" class="lightbox-caption"></div>
            </div>
            <button class="lightbox-next" aria-label="Next image">›</button>
        </div>
    </div>

    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="footer">
        <div class="footer-bg" aria-hidden="true"></div>
        <div class="footer-content">
            <div class="footer-brand">
                <img src="assets/logo.jpg" alt="Yasmin logo" class="footer-logo">
                <span>© 2026 Yasmin — All rights reserved.</span>
            </div>
            <div class="footer-links">
                <a href="index.html#home">Home</a>
                <a href="index.html#about">About</a>
                <a href="projects.html">Projects</a>
                <a href="index.html#skills">Skills</a>
                <a href="index.html#contact">Contact</a>
            </div>
            <b>MADE WITH ♥ BY YASMIN</b>
        </div>
    </footer>

    <!-- =========================
         FLOATING SOCIAL WITH "CONTACT US"
    ========================== -->
    <div class="floating-actions" aria-label="Quick contact actions">
        <div class="social-popup" id="socialPopup">
            <a class="social-icon whatsapp" href="https://wa.me/201234567890" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.5 3.5A11.7 11.7 0 0 0 12.2 0C5.7 0 .4 5.2.4 11.7c0 2.1.6 4.1 1.7 5.8L.3 23.9l6.6-1.7c1.6.9 3.4 1.3 5.2 1.3h.1c6.4 0 11.7-5.3 11.7-11.7 0-3.1-1.2-6.1-3.4-8.3Zm-8.3 18c-1.6 0-3.2-.4-4.6-1.2l-.3-.2-3.9 1 1-3.8-.2-.4a9.6 9.6 0 1 1 8 4.6Zm5.3-7.2c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.7.9-.8 1.1-.2.2-.3.2-.6.1-1.7-.8-2.8-1.5-3.9-3.4-.3-.5.3-.5.8-1.6.1-.3.1-.5 0-.7-.1-.2-.7-1.7-1-2.3-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.7s1.1 3.1 1.3 3.3c.2.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.5.8.6-.1 1.7-.7 1.9-1.3.2-.6.2-1.2.1-1.3-.1-.2-.3-.3-.6-.4Z"/>
                </svg>
                <span class="social-label">WhatsApp</span>
            </a>

            <a class="social-icon instagram" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="17.3" cy="6.8" r="1.2"/>
                </svg>
                <span class="social-label">Instagram</span>
            </a>

            <a class="social-icon facebook" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14 8h3V4h-3c-3.3 0-5 2-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9c0-.7.3-1 1-1z"/>
                </svg>
                <span class="social-label">Facebook</span>
            </a>

            <a class="social-icon linkedin" href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 8H2V21H5V8ZM3.5 3A2 2 0 1 0 3.5 7 2 2 0 1 0 3.5 3ZM9 8H6V21H9V14.2C9 12.4 9.5 11.2 11 11.2C12.5 11.2 13 12.4 13 14.2V21H16V13.7C16 10.1 14.7 8 12.1 8C10.8 8 9.8 8.6 9 9.7V8ZM19 8H16V21H19V14.5C19 12.8 19.5 11.5 21 11.5C22.5 11.5 23 12.8 23 14.5V21H26V13.7C26 10.1 24.7 8 22.1 8C20.8 8 19.8 8.6 19 9.7V8Z"/>
                </svg>
                <span class="social-label">LinkedIn</span>
            </a>
        </div>

        <button class="floating-contact-btn" id="floatingContactBtn" type="button" aria-label="Contact Us links" aria-expanded="false">
            <span class="contact-badge-text">CONTACT US</span>
            <span class="contact-badge-icon">✦</span>
        </button>

        <button class="floating-top" type="button" aria-label="Back to top">
            <span class="top-arrow">▲</span>
        </button>
    </div>

    <!-- Scripts -->
    <script src="projects-data.js"></script>
    <script src="project.js"></script>

</body>
</html>
